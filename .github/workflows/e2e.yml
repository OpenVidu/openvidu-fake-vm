name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

# Isolation profile shared by both e2e jobs: a namespace fully separate from any real
# fake-vm, and a prebuilt image tag so ensure_image skips rebuilding.
env:
  FAKE_VM_NETWORK: fake-vm-ci
  FAKE_VM_NAME_PREFIX: fake-vm-ci-
  FAKE_VM_SUBNET: 172.31.99.0/24
  FAKE_VM_GATEWAY: 172.31.99.1
  FAKE_VM_IP_PREFIX: 172.31.99
  FAKE_VM_IMAGE: openvidu-fake-vm:ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck -x -S warning \
            fake-vm.sh registry.sh fake-web.sh \
            tests/e2e/run.sh tests/e2e/profile.bash tests/e2e/test_helper.bash \
            .github/install-sysbox.sh

  # Each tier runs on BOTH runtimes in parallel: privileged (what hosted runners provide by
  # default) and sysbox (installed on the fly). The sysbox leg is non-blocking because sysbox
  # on hosted runners is best-effort — flip `continue-on-error` to false once it is proven.
  e2e-smoke:
    needs: lint
    runs-on: ubuntu-latest
    name: e2e-smoke (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        runtime: [privileged, sysbox]
    continue-on-error: ${{ matrix.runtime == 'sysbox' }}
    env:
      FAKE_VM_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sysbox
        if: matrix.runtime == 'sysbox'
        run: bash .github/install-sysbox.sh
      - name: Vendor bats
        run: make bootstrap
      - name: Build VM image
        run: docker build -t openvidu-fake-vm:ci .
      - name: Smoke tier
        run: E2E_TIER=smoke tests/e2e/run.sh
      - name: Cleanup
        if: always()
        run: ./fake-vm.sh stop --all --prune || true

  # Full tier (k3s / registry / fake-web) runs on every push to main and on manual dispatch,
  # on both runtimes. k3s inside a privileged container can be flaky on hosted runners; if it
  # becomes noisy, add `if: github.event_name == 'workflow_dispatch'` to make it manual-only.
  e2e-full:
    needs: lint
    runs-on: ubuntu-latest
    name: e2e-full (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        runtime: [privileged, sysbox]
    continue-on-error: ${{ matrix.runtime == 'sysbox' }}
    env:
      FAKE_VM_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install sysbox
        if: matrix.runtime == 'sysbox'
        run: bash .github/install-sysbox.sh
      - name: Vendor bats
        run: make bootstrap
      - name: Build VM image
        run: docker build -t openvidu-fake-vm:ci .
      - name: Full tier
        run: E2E_TIER=full tests/e2e/run.sh
      - name: Cleanup
        if: always()
        run: ./fake-vm.sh stop --all --prune || true
